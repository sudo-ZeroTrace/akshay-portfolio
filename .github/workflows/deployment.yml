name: Portfolio CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build production website
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: dist/

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/portfolio_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy build to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" \
            'mkdir -p ~/portfolio-deploy-tmp'

          scp -i ~/.ssh/deploy_key -r dist/. \
            "$EC2_USER@$EC2_HOST:portfolio-deploy-tmp/"

      - name: Deploy website files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" \
            'set -eu
             test -f ~/portfolio-deploy-tmp/index.html
             find ~/portfolio-deploy-tmp -mindepth 1 -maxdepth 1 -exec cp -a -t /var/www/Project1 -- {} +
             find /var/www/Project1 -maxdepth 1 -type f -name "index.html" -print -quit | grep -q .
             rm -rf ~/portfolio-deploy-tmp'
